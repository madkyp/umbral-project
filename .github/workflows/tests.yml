name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,W,B --ignore E501 umbral tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v
